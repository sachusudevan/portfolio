<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96" role="img" aria-labelledby="t">
  <title id="t">SACHU — Software Engineer &amp; Technical Lead</title>
  <style>
    .bg { fill: #121212; }
    .txt { font: 800 44px "Geist", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 6px; fill: #F5F5F5; }
    .dot { fill: #D72638; transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .line { fill: none; stroke: #D72638; stroke-width: 2; stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 3.6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes pulse { 50% { transform: scale(.7); opacity: .6; } }
    @keyframes draw { 0% { stroke-dashoffset: 200; } 35%, 75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -200; } }
    @media (prefers-reduced-motion: reduce) { .dot, .line { animation: none; stroke-dashoffset: 0; } }
  </style>
  <rect class="bg" width="360" height="96" rx="12"/>
  <text class="txt" x="40" y="62">SACHU</text>
  <rect class="dot" x="236" y="50" width="12" height="12" rx="2"/>
  <path class="line" d="M42 76 H242"/>
</svg>

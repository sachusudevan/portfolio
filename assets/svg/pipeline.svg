<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d">
  <title id="t">The EDI ENGINE claims pipeline</title>
  <desc id="d">EOB, 837 and self-pay files are ingested, split into pages, validated, transformed by EDI ENGINE, output as 835, CSV and TXT, and synced to a Client Portal dashboard.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2A2A2A" stroke-opacity=".6"/></pattern>
  </defs>
  <style>
    text { font-family: "JetBrains Mono", Consolas, ui-monospace, monospace; }
    .sheet, .chip { fill: #121212; stroke: #EDEDED; stroke-width: 1.5; }
    .fold { fill: none; stroke: #EDEDED; stroke-width: 1.5; }
    .ln { fill: #3A3A3A; }
    .lbl { font-size: 13px; fill: #8A8A8A; font-weight: 500; }
    .lbl-b { font-size: 13px; fill: #EDEDED; font-weight: 700; }
    .wire { fill: none; stroke: #C6F432; stroke-width: 2; stroke-dasharray: 1; stroke-dashoffset: 0; }
    .gate { stroke: #3A3A3A; stroke-width: 2; stroke-dasharray: 4 6; }
    .ring-chk { fill: #C6F432; transform-box: fill-box; transform-origin: center; }
    .mark { fill: none; stroke: #0B0B0B; stroke-width: 2.5; stroke-dasharray: 20; stroke-dashoffset: 0; }
    .core { transform-box: fill-box; transform-origin: center; }
    .core-box { fill: #C6F432; }
    .core-txt { fill: #0B0B0B; font-size: 22px; font-weight: 700; letter-spacing: .04em; }
    .core-ring { fill: none; stroke: #C6F432; stroke-opacity: .6; stroke-width: 1.5; stroke-dasharray: 6 10; transform-origin: 580px 280px; animation: spin 14s linear infinite; }
    .bar { fill: #C6F432; transform-box: fill-box; transform-origin: bottom; }
    .pk { fill: #C6F432; }
    .prompt { font-size: 15px; fill: #EDEDED; }
    .caret { fill: #C6F432; animation: blink 1s steps(1) infinite; }

    .a-doc { animation: doc 8s cubic-bezier(.16,1,.3,1) infinite; }
    .a-doc:nth-of-type(2) { animation-delay: .12s; }
    .a-doc:nth-of-type(3) { animation-delay: .24s; }
    .a-page { animation: page 8s ease-out infinite; }
    .a-gate { animation: show-gate 8s linear infinite; }
    .ring-chk { animation: pop 8s cubic-bezier(.34,1.56,.64,1) infinite; }
    .mark { animation: tick 8s ease-out infinite; }
    .w-in { animation: wire-in 8s ease-in-out infinite; }
    .core { animation: core 8s cubic-bezier(.34,1.56,.64,1) infinite; }
    .w-out { animation: wire-out 8s ease-in-out infinite; }
    .a-out { animation: out 8s ease-out infinite; }
    .w-sync { animation: sync 8s ease-in-out infinite; }
    .a-dash { animation: dash 8s ease-out infinite; }
    .bar { animation: bars 8s cubic-bezier(.16,1,.3,1) infinite; }

    @keyframes doc { 0% { opacity: 0; transform: translateX(-40px); } 10%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes page { 0%, 10% { opacity: 0; transform: translateX(-30px); } 18%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes show-gate { 0%, 18% { opacity: 0; } 24%, 90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pop { 0%, 22% { opacity: 0; transform: scale(0); } 28%, 90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
    @keyframes tick { 0%, 26% { stroke-dashoffset: 20; opacity: 1; } 32%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { opacity: 0; } }
    @keyframes wire-in { 0%, 32% { stroke-dashoffset: 1; opacity: 1; } 42%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { opacity: 0; } }
    @keyframes core { 0%, 36% { opacity: 0; transform: scale(.4); } 44%, 90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
    @keyframes wire-out { 0%, 50% { stroke-dashoffset: 1; opacity: 1; } 58%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { opacity: 0; } }
    @keyframes out { 0%, 55% { opacity: 0; transform: translateX(-16px); } 62%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes sync { 0%, 64% { stroke-dashoffset: 1; opacity: 1; } 68%, 90% { stroke-dashoffset: 0; opacity: 1; } 100% { opacity: 0; } }
    @keyframes dash { 0%, 66% { opacity: 0; transform: translateY(16px); } 72%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes bars { 0%, 70% { transform: scaleY(0); opacity: 1; } 80%, 90% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .pk { display: none; }
    }
  </style>

  <rect width="1100" height="560" fill="#0B0B0B"/>
  <rect width="1100" height="560" fill="url(#grid)"/>
  <text class="prompt" x="40" y="44"><tspan fill="#C6F432">$</tspan> ./edi-engine --in eob,837,self-pay --out 835,csv,txt</text>
  <rect class="caret" x="512" y="31" width="9" height="17"/>

  <g class="a-doc"><g transform="translate(40 100)"><path class="sheet" d="M0 0H82L100 18V64H0Z"/><path class="fold" d="M82 0V18H100"/><rect class="ln" x="12" y="14" width="44" height="4"/><rect class="ln" x="12" y="24" width="60" height="4"/><text class="lbl-b" x="12" y="52">EOB</text></g></g>
  <g class="a-doc"><g transform="translate(40 248)"><path class="sheet" d="M0 0H82L100 18V64H0Z"/><path class="fold" d="M82 0V18H100"/><rect class="ln" x="12" y="14" width="44" height="4"/><rect class="ln" x="12" y="24" width="60" height="4"/><text class="lbl-b" x="12" y="52">837</text></g></g>
  <g class="a-doc"><g transform="translate(40 396)"><path class="sheet" d="M0 0H82L100 18V64H0Z"/><path class="fold" d="M82 0V18H100"/><rect class="ln" x="12" y="14" width="44" height="4"/><rect class="ln" x="12" y="24" width="60" height="4"/><text class="lbl-b" x="12" y="52">SELF-PAY</text></g></g>

  <g class="a-page">
    <rect class="sheet" x="200" y="94" width="34" height="44"/><rect class="sheet" x="214" y="114" width="34" height="44"/>
    <rect class="sheet" x="200" y="242" width="34" height="44"/><rect class="sheet" x="214" y="262" width="34" height="44"/>
    <rect class="sheet" x="200" y="390" width="34" height="44"/><rect class="sheet" x="214" y="410" width="34" height="44"/>
  </g>

  <line class="gate a-gate" x1="330" y1="70" x2="330" y2="490"/>
  <g transform="translate(330 132)"><rect class="ring-chk" x="-14" y="-14" width="28" height="28"/><path class="mark" d="M-6 0l4 4 8-8"/></g>
  <g transform="translate(330 280)"><rect class="ring-chk" x="-14" y="-14" width="28" height="28"/><path class="mark" d="M-6 0l4 4 8-8"/></g>
  <g transform="translate(330 428)"><rect class="ring-chk" x="-14" y="-14" width="28" height="28"/><path class="mark" d="M-6 0l4 4 8-8"/></g>

  <path class="wire w-in" pathLength="1" d="M344 132 C 430 132, 440 280, 500 280"/>
  <path class="wire w-in" pathLength="1" d="M344 280 L 500 280"/>
  <path class="wire w-in" pathLength="1" d="M344 428 C 430 428, 440 280, 500 280"/>

  <circle class="core-ring" cx="580" cy="280" r="118"/>
  <g class="core"><rect class="core-box" x="505" y="205" width="150" height="150"/><text class="core-txt" x="580" y="288" text-anchor="middle">EDI ENGINE</text></g>

  <path class="wire w-out" pathLength="1" d="M660 280 C 710 280, 710 150, 760 150"/>
  <path class="wire w-out" pathLength="1" d="M660 280 L 760 280"/>
  <path class="wire w-out" pathLength="1" d="M660 280 C 710 280, 710 410, 760 410"/>

  <g class="a-out"><rect class="chip" x="760" y="128" width="96" height="44"/><text class="lbl-b" x="808" y="156" text-anchor="middle">835</text></g>
  <g class="a-out"><rect class="chip" x="760" y="258" width="96" height="44"/><text class="lbl-b" x="808" y="286" text-anchor="middle">CSV</text></g>
  <g class="a-out"><rect class="chip" x="760" y="388" width="96" height="44"/><text class="lbl-b" x="808" y="416" text-anchor="middle">TXT</text></g>

  <path class="wire w-sync" pathLength="1" d="M856 280 L 900 280"/>
  <g class="a-dash">
    <rect class="chip" x="900" y="190" width="180" height="180"/>
    <text class="lbl" x="916" y="216">PORTAL</text>
    <rect class="bar" x="920" y="290" width="26" height="60"/>
    <rect class="bar" x="960" y="250" width="26" height="100"/>
    <rect class="bar" x="1000" y="270" width="26" height="80"/>
    <rect class="bar" x="1040" y="220" width="26" height="130"/>
  </g>

  <rect class="pk" x="-5" y="-5" width="10" height="10" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.44;.54;1" path="M344 132 C 430 132, 440 280, 500 280"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.439;.44;.54;.541;1"/></rect>
  <rect class="pk" x="-5" y="-5" width="10" height="10" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.46;.54;1" path="M344 280 L 500 280"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.459;.46;.54;.541;1"/></rect>
  <rect class="pk" x="-5" y="-5" width="10" height="10" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.48;.58;1" path="M344 428 C 430 428, 440 280, 500 280"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.479;.48;.58;.581;1"/></rect>
  <rect class="pk" x="-5" y="-5" width="10" height="10" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.58;.66;1" path="M660 280 C 710 280, 710 150, 760 150"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.579;.58;.66;.661;1"/></rect>
  <rect class="pk" x="-5" y="-5" width="10" height="10" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.6;.66;1" path="M660 280 L 760 280"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.599;.6;.66;.661;1"/></rect>
  <rect class="pk" x="-5" y="-5" width="10" height="10" opacity="0"><animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.62;.7;1" path="M660 280 C 710 280, 710 410, 760 410"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.619;.62;.7;.701;1"/></rect>

  <text class="lbl" x="40" y="530">01 INGEST</text>
  <text class="lbl" x="200" y="530">02 SPLIT</text>
  <text class="lbl" x="330" y="530" text-anchor="middle">03 VALIDATE</text>
  <text class="lbl" x="580" y="530" text-anchor="middle">04 TRANSFORM</text>
  <text class="lbl" x="760" y="530">05 DELIVER</text>
</svg>
